name: Audio TTS A-B 20260812

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  calibrar-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.2.8

      - name: Gerar e validar seis amostras A-B
        run: |
          python tmp_audio_ab_20260812/gerar_ab.py

      - name: Publicar amostras
        uses: actions/upload-artifact@v4
        with:
          name: AUDIO_TTS_AB_20260812
          path: tmp_audio_ab_20260812/output/
          if-no-files-found: error
          retention-days: 7
